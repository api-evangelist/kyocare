apis:
- aid: kyocare:attain
  name: Kyo Attain Platform API
  description: 'The Attain platform API is the backend serving the Kyo Care portal
    (portal.kyocare.com) and the Kyo Care mobile app. It is an OAuth 2.0 / OpenID
    Connect protected API fronted by AWS Cognito, publishing live
    /.well-known/openid-configuration and /.well-known/oauth-authorization-server
    discovery documents that advertise authorization_code (with PKCE S256) and
    client_credentials grants. No public OpenAPI, documentation or open registration
    is offered — access is limited to Kyo''s own first-party clients.'
