aid: kyocare
name: Kyo
description: 'Kyo (kyocare.com) is a US provider of Applied Behavior Analysis (ABA)
  therapy for autistic children and young adults, delivering in-home, in-school and
  center-based care across 20+ locations with in-network coverage from major insurers.
  Kyo runs a client-facing digital surface — the Kyo Care portal and mobile app — for
  scheduling, session notes, progress tracking and family communication, backed by
  the internal "Attain" platform API (api.attain.kyocare.com) that publishes live
  OpenID Connect and RFC 8414 discovery documents over AWS Cognito, plus a private
  Workato-managed partner gateway at api.kyocare.com. Kyo publishes no public developer
  program, documentation or SDKs; its API surface is private to its own applications
  and payer integrations.'
